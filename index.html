<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>разбор роблоксеров</title>
<style>
:root{color-scheme:dark;--bg:#04070f;--b1:#2d5bff;--b2:#6fa8ff;--cy:#38e8ff;--ink:#eef2ff;--mut:#8a96bf;--line:rgba(110,150,255,.22);--card:rgba(10,16,38,.78)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,Arial,sans-serif;overflow-x:hidden;text-transform:lowercase;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(60% 50% at 78% 38%,rgba(45,91,255,.32),transparent 70%),radial-gradient(40% 40% at 10% 90%,rgba(56,232,255,.1),transparent 70%)}
body::after{content:"";position:fixed;inset:-48px 0 0 0;z-index:-1;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:64px 64px;opacity:.35;mask-image:radial-gradient(70% 60% at 60% 35%,#000,transparent);animation:drift 12s linear infinite}
@keyframes drift{to{transform:translateY(64px)}}
.wrap{width:100%;max-width:1480px;margin:0 auto;padding:0 clamp(20px,5vw,80px)}
nav .wrap{display:flex;justify-content:space-between;align-items:center;height:76px;border-bottom:1px solid var(--line)}
.logo{font-weight:800;letter-spacing:1px;color:var(--ink);text-decoration:none}
.live{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:14px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--cy);box-shadow:0 0 0 0 rgba(56,232,255,.7);animation:ping 2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 12px rgba(56,232,255,0)}100%{box-shadow:0 0 0 0 rgba(56,232,255,0)}}
.hero .wrap{display:grid;grid-template-columns:1.15fr 1fr;align-items:center;min-height:calc(100vh - 76px);gap:20px}
h1{font-size:clamp(48px,9vw,148px);line-height:.9;margin:0 0 44px;font-weight:900;letter-spacing:-.04em}
h1 .ln{display:block;overflow:hidden;padding-bottom:.08em}
h1 .ln span{display:block;transform:translateY(110%);animation:up 1s cubic-bezier(.2,.8,.2,1) forwards}
h1 .ln:nth-child(2) span{animation-delay:.15s;background:linear-gradient(90deg,var(--b2),var(--b1) 60%,var(--cy));-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes up{to{transform:none}}
.btn{position:relative;display:inline-flex;align-items:center;gap:14px;overflow:hidden;background:var(--b1);color:#fff;border:0;border-radius:6px;padding:20px 34px;font-size:19px;font-weight:700;cursor:pointer;text-decoration:none;opacity:0;animation:fade .8s .5s forwards;transition:background .25s,box-shadow .25s;box-shadow:0 10px 40px rgba(45,91,255,.35)}
.btn:hover{background:#3f6bff;box-shadow:0 14px 50px rgba(45,91,255,.6)}
.btn b{display:inline-block;transition:transform .25s;font-weight:400}
.btn:hover b{transform:translateX(6px)}
.btn::after{content:"";position:absolute;top:0;left:-70%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:sw 4s 1.5s infinite}
@keyframes sw{50%,100%{left:140%}}
@keyframes fade{to{opacity:1}}
.stage{position:relative;display:grid;place-items:center;opacity:0;animation:fade 1.2s .3s forwards}
.stage::before{content:"";position:absolute;width:78%;aspect-ratio:1;border-radius:50%;border:1px solid var(--line);box-shadow:0 0 120px rgba(45,91,255,.45) inset,0 0 80px rgba(45,91,255,.25)}
.stage::after{content:"";position:absolute;width:98%;aspect-ratio:1;border-radius:50%;border:1px solid var(--line);border-top-color:var(--cy);animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.stage img{position:relative;z-index:2;width:100%;max-width:640px;filter:drop-shadow(0 0 40px rgba(45,91,255,.7));animation:fl 6s ease-in-out infinite;user-select:none}
@keyframes fl{50%{translate:0 -14px}}
section.ap{padding:110px 0 100px;border-top:1px solid var(--line)}
section.ap .wrap{display:grid;grid-template-columns:1fr 1.2fr;gap:60px;align-items:start}
.tag{color:var(--cy);font-size:14px;letter-spacing:2px;margin-bottom:14px}
h2{font-size:clamp(36px,5vw,72px);line-height:1;margin:0;letter-spacing:-.03em}
.rv{opacity:0;transform:translateY(40px);transition:opacity .9s,transform .9s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
form{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:12px;padding:clamp(22px,3vw,40px)}
label{display:block;font-size:14px;color:var(--mut);margin:0 0 8px;letter-spacing:.5px}
.f{margin-bottom:24px}
input[type=text],textarea{width:100%;padding:15px 16px;border-radius:8px;border:1px solid var(--line);background:rgba(4,7,15,.8);color:var(--ink);font:inherit;font-size:16px;text-transform:lowercase;transition:border-color .25s,box-shadow .25s}
input:focus,textarea:focus{outline:none;border-color:var(--b2);box-shadow:0 0 0 4px rgba(45,91,255,.22)}
textarea{min-height:110px;resize:vertical}
.hp{position:absolute;left:-9999px}
form .btn{opacity:1;animation:none;margin-top:14px;width:100%;justify-content:center}
form .btn::after{display:none}
form .btn:disabled{opacity:.6;cursor:default}
#msg{margin-top:20px;min-height:26px;font-weight:600}
.ok{color:#5fd0ff}.err{color:#ff7b7b}
footer{border-top:1px solid var(--line);text-align:center;color:var(--mut);padding:36px 20px}
a{color:var(--cy)}
#admin{display:none;padding:60px 0;border-top:1px solid var(--line)}
@media(max-width:860px){.hero .wrap,section.ap .wrap{grid-template-columns:1fr}.hero .wrap{min-height:auto;padding-top:40px;padding-bottom:40px}.stage{grid-row:2;max-width:420px;margin:30px auto 0}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}h1 .ln span,.btn,.stage,.rv{opacity:1;transform:none}}

@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
#cv{position:fixed;inset:0;z-index:-1;pointer-events:none}
#glow{position:fixed;width:520px;height:520px;border-radius:50%;pointer-events:none;z-index:0;left:-999px;top:-999px;background:radial-gradient(circle,rgba(56,232,255,.13),transparent 65%);transform:translate(-50%,-50%)}
.btn{transition:background .25s,box-shadow .25s,transform .2s,translate .15s}
.btn:hover{transform:translateY(-3px)}
.btn:active{transform:scale(.96)}
.rp{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rp .6s ease-out forwards;pointer-events:none}
@keyframes rp{to{transform:scale(4);opacity:0}}
form{position:relative;border:1px solid transparent;background:linear-gradient(var(--card),var(--card)) padding-box,conic-gradient(from var(--a),rgba(110,150,255,.15),var(--cy),rgba(110,150,255,.15) 40%,var(--b1),rgba(110,150,255,.15)) border-box;animation:rot 8s linear infinite;transition:box-shadow .4s}
form:focus-within{box-shadow:0 0 70px rgba(45,91,255,.35)}
@keyframes rot{to{--a:360deg}}
input[type=text]:hover,textarea:hover{border-color:rgba(111,168,255,.55)}
label{transition:color .25s,transform .25s}
.f:focus-within label{color:var(--cy);transform:translateX(6px)}
.logo{position:relative}
.logo::after{content:"";position:absolute;left:0;bottom:-6px;height:2px;width:0;background:var(--cy);transition:width .3s}
.logo:hover::after{width:100%}
.shake{animation:sk .45s}
@keyframes sk{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
#msg.ok{animation:pop .6s}
@keyframes pop{0%{transform:scale(.8);opacity:0}60%{transform:scale(1.08)}100%{transform:none;opacity:1}}
.stage{transition:transform .15s ease-out}
h1 .ln:nth-child(2) span{background-size:200% 100%;animation:up 1s .15s cubic-bezier(.2,.8,.2,1) forwards,gs 6s 1.2s linear infinite}
@keyframes gs{to{background-position:200% 0}}
</style></head><body>

<section class="ap" id="apply"><div class="wrap">
<div class="rv"><div class="tag">/ заявка</div><h2>хочу<br>попасть</h2></div>
<form id="f" class="rv">
<div class="f"><label>ссылка на канал *</label><input type="text" id="url" placeholder="https://tiktok.com/@ник" required></div>
<div class="f"><label>что разобрать? какие вопросы?</label><textarea id="ask" placeholder="контент, оформление, идеи, почему нет просмотров..."></textarea></div>
<div class="f"><label>как с тобой связаться? *</label><input type="text" id="contact" placeholder="telegram / discord" required></div>
<input class="hp" type="text" id="hp" tabindex="-1" autocomplete="off">
<button class="btn" type="submit" id="go">отправить заявку <b>→</b></button>
<div id="msg"></div>
</form></div></section>

<section id="admin"><div class="wrap"><h2 style="font-size:36px;margin-bottom:20px">заявки</h2>
<input type="text" id="code" placeholder="код доступа" autocomplete="off" style="max-width:320px;margin-right:8px;display:inline-block">
<button class="btn" id="lg" style="font-size:16px;padding:14px 24px;opacity:1;animation:none">войти</button>
<div id="list" style="margin-top:20px"></div></div></section>
<footer>by <a href="https://www.tiktok.com/@matey_rbx" target="_blank" rel="noopener">@matey_rbx</a></footer>

<script>
const API="https://razbor.romahakorin.workers.dev";
const $=id=>document.getElementById(id);
let msg=(t,c)=>{$('msg').textContent=t;$('msg').className=c};
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.15});
document.querySelectorAll('.rv').forEach(el=>io.observe(el));
$('f').addEventListener('submit',async e=>{
 e.preventDefault();
 if($('hp').value)return;
 const url=$('url').value.trim(),contact=$('contact').value.trim();
 if(url.length<4||contact.length<2){msg('заполни обязательные поля','err');return}
 try{if(Date.now()-(+localStorage.getItem('lastApp')||0)<60000){msg('подожди минуту перед следующей заявкой','err');return}}catch(_){}
 $('go').disabled=true;msg('отправляю...','');
 try{
  const r=await fetch(API+'/apply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url,ask:$('ask').value.trim(),contact})});
  if(!r.ok)throw 0;const j=await r.json();
  try{localStorage.setItem('lastApp',Date.now())}catch(_){}
  $('f').reset();msg('заявка №'+j.n+' принята, жди','ok');
 }catch(err){msg('заявка не отправилась. попробуй ещё раз или напиши в tiktok @matey_rbx','err')}
 $('go').disabled=false;
});

const gl=$('glow');
addEventListener('pointermove',e=>{gl.style.left=e.clientX+'px';gl.style.top=e.clientY+'px'});
const st=document.querySelector('.stage');
addEventListener('pointermove',e=>{const x=(e.clientX/innerWidth-.5)*10,y=(e.clientY/innerHeight-.5)*-10;st.style.transform=`perspective(900px) rotateY(${x}deg) rotateX(${y}deg)`});
document.querySelectorAll('.btn').forEach(b=>{
 b.addEventListener('pointermove',e=>{const r=b.getBoundingClientRect();b.style.translate=((e.clientX-r.left-r.width/2)*.12)+'px '+((e.clientY-r.top-r.height/2)*.25)+'px'});
 b.addEventListener('pointerleave',()=>b.style.translate='');
 b.addEventListener('click',e=>{const r=b.getBoundingClientRect(),s=document.createElement('span'),d=Math.max(r.width,r.height)/4;
  s.className='rp';s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;b.append(s);setTimeout(()=>s.remove(),600)})});
const _m=msg;msg=(t,c)=>{_m(t,c);if(c==='err'){const f=$('f');f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake')}};
const cv=$('cv'),cx=cv.getContext('2d');let P=[];
function rs(){cv.width=innerWidth;cv.height=innerHeight;P=Array.from({length:Math.min(70,innerWidth/18|0)},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,r:Math.random()*1.8+.4,v:Math.random()*.4+.1,a:Math.random()*.6+.2}))}
rs();addEventListener('resize',rs);
(function t(){cx.clearRect(0,0,cv.width,cv.height);
 P.forEach(p=>{p.y-=p.v;if(p.y<-5){p.y=cv.height+5;p.x=Math.random()*cv.width}cx.fillStyle=`rgba(111,168,255,${p.a})`;cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.3);cx.fill()});
 requestAnimationFrame(t)})();
const adm=$('admin');
function openAdm(){adm.style.display='block';adm.scrollIntoView()}
if(location.hash==='#admin')openAdm();
addEventListener('hashchange',()=>{if(location.hash==='#admin')openAdm()});
let CODE='';
async function load(){
 const L=$('list');
 try{const r=await fetch(API+'/list',{headers:{'x-admin':CODE}});
  if(r.status===401){L.textContent='неверный код';return}
  const d=await r.json();L.textContent='';
  if(!d.items.length){L.textContent='пока пусто';return}
  d.items.forEach(a=>{const w=document.createElement('div');
   w.style.cssText='border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px;background:var(--card);word-break:break-word';
   const t=document.createElement('b');t.textContent='#'+a.n+' ['+a.status+'] '+a.url;
   const m=document.createElement('div');m.style.color='var(--mut)';m.textContent='связь: '+a.contact+' | '+new Date(a.ts).toLocaleString('ru');
   const q=document.createElement('div');q.textContent=a.ask||'';
   w.append(t,m,q);
   ['выбрана','разобрано','отклонена'].forEach(s=>{const b=document.createElement('button');b.textContent=s;
    b.style.cssText='margin:8px 6px 0 0;border:1px solid var(--line);background:#04070f;color:var(--ink);border-radius:6px;padding:5px 10px;cursor:pointer';
    b.onclick=async()=>{await fetch(API+'/status',{method:'POST',headers:{'x-admin':CODE,'Content-Type':'application/json'},body:JSON.stringify({key:a.key,status:s})});load()};w.append(b)});
   L.append(w)})}catch(e){L.textContent='ошибка связи с сервером'}}
$('lg').onclick=()=>{CODE=$('code').value.trim();load()};
</script></body></html>
