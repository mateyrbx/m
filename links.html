<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap&subset=cyrillic" rel="stylesheet"><title>links</title>
<style>
:root{color-scheme:dark;--bg:#010310;--b:#0a2bd0;--b2:#2f6bff;--txt:#eef3ff;--mut:#8ea3d9;--card:rgba(5,14,55,.55);--bd:rgba(110,150,255,.25);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--txt);font-family:"Inter","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;min-height:100vh;overflow-x:hidden;position:relative}
.orb{position:fixed;border-radius:50%;filter:blur(90px);opacity:.55;z-index:0;animation:drift 14s ease-in-out infinite alternate}
.o1{width:520px;height:520px;background:var(--b);top:-120px;left:-120px}
.o2{width:460px;height:460px;background:#07197a;bottom:-140px;right:-100px;animation-delay:-5s}
.o3{width:300px;height:300px;background:#0630c4;top:40%;left:45%;opacity:.3;animation-delay:-9s}
@keyframes drift{to{transform:translate(70px,50px) scale(1.15)}}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
main{position:relative;z-index:1;max-width:1100px;margin:0 auto;min-height:100vh;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:20px;padding:32px 24px}
.hero{position:relative;display:flex;justify-content:center;align-items:center}
.ring{position:absolute;width:min(440px,90%);aspect-ratio:1;border-radius:50%;border:2px solid var(--bd);box-shadow:0 0 80px rgba(31,77,255,.55),inset 0 0 60px rgba(31,77,255,.35);animation:pulse 4s ease-in-out infinite}
.ring.r2{width:min(540px,108%);border-style:dashed;animation:spin 40s linear infinite;box-shadow:none;opacity:.5}
@keyframes pulse{50%{transform:scale(1.05);opacity:.7}}
@keyframes spin{to{transform:rotate(360deg)}}
#char{position:relative;width:min(480px,100%);filter:drop-shadow(0 0 30px rgba(50,100,255,.7));animation:float 5s ease-in-out infinite,in 1.2s cubic-bezier(.2,.9,.2,1) both;transition:transform .15s ease-out}
@keyframes float{50%{margin-top:-18px}}
@keyframes in{from{opacity:0;transform:translateY(60px) scale(.9);filter:blur(12px)}}
.info{display:flex;flex-direction:column;gap:14px}
.tag{font-size:13px;letter-spacing:.3em;color:var(--b2);text-transform:uppercase;animation:up .8s .2s both}
h1{font-size:clamp(44px,7vw,78px);line-height:1;font-weight:800;background:linear-gradient(90deg,#fff,var(--b2),var(--b),#fff);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:up .8s .35s both,shine 6s linear infinite}
@keyframes shine{to{background-position:-250% 0}}
.sub{color:var(--mut);font-size:17px;margin-bottom:12px;animation:up .8s .5s both}
@keyframes up{from{opacity:0;transform:translateY(24px)}}
.link{position:relative;display:flex;align-items:center;gap:16px;padding:18px 20px;border-radius:20px;background:var(--card);border:1px solid var(--bd);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--txt);text-decoration:none;overflow:hidden;transition:transform .25s,border-color .25s,box-shadow .25s;animation:up .7s both}
.link:nth-of-type(1){animation-delay:.65s}.link:nth-of-type(2){animation-delay:.8s}.link:nth-of-type(3){animation-delay:.95s}
.link::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(120,170,255,.28),transparent 70%);transform:translateX(-100%);transition:transform .7s}
.link:hover{transform:translateY(-4px) scale(1.02);border-color:var(--b2);box-shadow:0 10px 40px rgba(31,77,255,.5)}
.link:hover::before{transform:translateX(100%)}
.link:active{transform:scale(.98)}
.ic{flex:none;width:50px;height:50px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#0a2bd0,#071a73);box-shadow:0 0 20px rgba(31,77,255,.6)}
.ic svg{width:26px;height:26px;fill:#fff}
.t{flex:1;min-width:0}.t b{display:block;font-size:20px;font-weight:600;letter-spacing:-.01em;text-transform:lowercase}.t span{color:var(--mut);font-size:14px;overflow-wrap:anywhere}
.ar{font-size:22px;color:var(--b2);transition:transform .25s}.link:hover .ar{transform:translateX(6px)}
@media(max-width:820px){main{grid-template-columns:1fr;padding-top:20px}.hero{order:-1}#char{width:min(340px,80%)}.ring{width:min(300px,70%)}.ring.r2{width:min(370px,86%)}.info{text-align:center}.link{text-align:left}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
